<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Rubro-Negro - EC Vitória</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://cdn.freebiesupply.com/logos/large/2x/esporte-clube-vitoria-de-salvador-ba-logo-png-transparent.png" 
             alt="Logo EC Vitória" class="logo-vitoria">
    </div>

    <div class="card-atividade">
        <h3>Exercícios</h3>
        <p>Crie um site para solicitar dois números e ao final mostre:</p>
        <p>A média, a soma, o produto, o maior e o menor número.</p>
        <p>Usando uma linha para cada resultado. Deve ter logotipo.</p>
    </div>

    <hr>

    <h1>Portal do Leão</h1>

    <div class="input-group">
        <label for="n1">Primeiro Número:</label>
        <input type="number" id="n1" placeholder="Ex: 10">
    </div>

    <div class="input-group">
        <label for="n2">Segundo Número:</label>
        <input type="number" id="n2" placeholder="Ex: 5">
    </div>

    <button onclick="calcular()">Calcular Resultados</button>

    <div id="resultado" class="hidden"></div>
</div>

<script src="script.js"></script>
</body>
</html>
