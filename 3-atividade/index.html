<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <img src="assets/logotipo.png" alt="Logotipo da Escola" class="logo">
        
      <div class="card-exercicio">
    <h3>Exercício 3 </h3>
    <p>
        Crie um sistema que solicite três notas ao usuário e calcule a média.
        <br><br>
        Caso a média seja menor que 7, o aluno estará <strong>reprovado</strong>,
        caso contrário estará <strong>aprovado</strong>.
        <br><br>
        Mostrar: média final e situação do aluno.
    </p>
</div>
    
        <h2>Cálculo de Média</h2>
        
        <div class="input-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" placeholder="Ex: 8.5">
        </div>
        
        <div class="input-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" placeholder="Ex: 7.0">
        </div>
        
        <div class="input-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" step="0.1" placeholder="Ex: 6.5">
        </div>

        <button onclick="calcularMedia()">Calcular Média</button>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
