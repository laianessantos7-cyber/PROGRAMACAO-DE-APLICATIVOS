<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada do Creeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="creeper-face"></div>
        
        <h1>TABUADA DO CREEPER</h1>
        
        <label for="numero">DIGITE UM NÚMERO:</label>
        <input type="number" id="numero" placeholder="Ex: 7">
        
        <button onclick="gerarTabuada()">GERAR TABUADA</button>

        <div id="resultadoTabuada">
            AGUARDANDO NÚMERO...
        </div>
    </div>

    <script>
        function gerarTabuada() {
            const num = document.getElementById('numero').value;
            const res = document.getElementById('resultadoTabuada');
            
            if (num === "") {
                res.innerHTML = "DIGITE UM NÚMERO!";
                return;
            }

            let tabuada = "";
            for (let i = 1; i <= 10; i++) {
                tabuada += `${num} x ${i} = ${num * i}<br>`;
            }
            res.innerHTML = tabuada;
        }
    </script>

</body>
</html>
