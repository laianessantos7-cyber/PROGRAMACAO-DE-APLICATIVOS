<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aposentadoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- LOGO -->
        <img src="assets/logo.png"class="logo">
        <div class="logo"></div>

        <!-- CARD DO EXERCÍCIO -->
        <div class="card-exercicio">
            <h3>📘 Exercício</h3>
            <p>
                Elabore um algoritmo usando operações lógicas para verificar se um empregado está qualificado para aposentadoria.<br><br>

                ✔ Ter no mínimo <strong>65 anos</strong><br>
                ✔ OU ter trabalhado no mínimo <strong>30 anos</strong><br><br>

                O sistema deve mostrar:<br>
                matrícula, idade, tempo de trabalho e o resultado.
            </p>
        </div>

        <h2>👨‍💼 Verificar Aposentadoria</h2>

        <div class="form-group">
            <label>🔢 Matrícula:</label>
            <input type="number" id="matricula">
        </div>

        <div class="form-group">
            <label>🎂 Ano de Nascimento:</label>
            <input type="number" id="anoNascimento">
        </div>

        <div class="form-group">
            <label>⏳ Tempo de Trabalho:</label>
            <input type="number" id="tempoTrabalho">
        </div>

        <button onclick="verificarAposentadoria()">🚀 Verificar</button>

        <div id="resultado" class="hidden"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
